name: YCloud Icons Angular Checks

on:
  # Automatic checks are handled by icons-frameworks.yml
  # This workflow can be triggered manually for targeted testing
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: YCloud Icons Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @ycloud-web/icons-angular build

      - name: Test
        run: pnpm --filter @ycloud-web/icons-angular test
