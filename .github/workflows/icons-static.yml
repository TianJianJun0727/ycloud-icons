name: YCloud Icons Static Checks

on:
  # Automatic checks are handled by icons-frameworks.yml
  # This workflow can be triggered manually for targeted testing
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  icons-static:
    name: YCloud Icons Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nub
      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Build
        run: nub --filter @ycloud-web/icons-static build
