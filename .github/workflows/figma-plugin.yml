name: Figma Plugin Checks

on:
  pull_request:
    paths:
      - .github/actions/setup-nub/**
      - .github/workflows/figma-plugin.yml
      - apps/figma-plugin/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nub
      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Build
        run: nub run figma:build

      - name: Typecheck
        run: nub run figma:typecheck

      - name: Lint
        run: nubx oxlint apps/figma-plugin --quiet

      - name: Format check
        run: nubx oxfmt --check 'apps/figma-plugin/**/*.{js,mjs,ts,jsx,tsx,html,css,scss,json,yml,yaml}' --ignore-path .oxfmtignore --no-error-on-unmatched-pattern
