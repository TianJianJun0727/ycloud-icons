name: YCloud Icons React Checks

on:
  # Automatic checks are handled by icons-frameworks.yml
  # This workflow can be triggered manually for targeted testing
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: YCloud Icons React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nub
      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Build
        run: nub --filter @ycloud-web/icons-react build

      - name: Test
        run: nub --filter @ycloud-web/icons-react test
