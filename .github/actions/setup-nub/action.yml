name: Setup Nub and Node.js
description: Setup Nub, provision the project-pinned Node.js, and cache the Nub package store.

inputs:
  node-version-file:
    description: File that declares the Node.js version.
    required: false
    default: package.json
  registry-url:
    description: Optional npm registry URL for publish jobs.
    required: false
    default: ''
  cache-mode:
    description: Use restore-save to populate the cache, or restore to only read from it.
    required: false
    default: restore-save

runs:
  using: composite
  steps:
    - name: Setup Nub and Node.js
      if: inputs.registry-url == ''
      uses: nubjs/setup-nub@v0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false

    - name: Setup Nub and Node.js for npm publishing
      if: inputs.registry-url != ''
      uses: nubjs/setup-nub@v0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false

    - name: Print Nub version
      shell: bash
      run: nub --version

    - name: Add pnpm compatibility shim
      shell: bash
      run: |
        nub pm shim
        mkdir -p "$RUNNER_TEMP/nub-pnpm-shim"
        ln -sf "$HOME/.nub/shims/pnpm" "$RUNNER_TEMP/nub-pnpm-shim/pnpm"
        echo "$RUNNER_TEMP/nub-pnpm-shim" >> "$GITHUB_PATH"

    - name: Resolve Nub store path
      id: nub-store
      shell: bash
      run: echo "path=$(nub store path)" >> "$GITHUB_OUTPUT"

    - name: Restore Nub store
      if: inputs.cache-mode == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.nub-store.outputs.path }}
        key: nub-store-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          nub-store-${{ runner.os }}-

    - name: Restore and save Nub store
      if: inputs.cache-mode != 'restore'
      uses: actions/cache@v6
      with:
        path: ${{ steps.nub-store.outputs.path }}
        key: nub-store-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          nub-store-${{ runner.os }}-
